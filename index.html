<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Briar Crown</title>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="%23161f18"/><path d="M32 8 48 56H16z" fill="%23d7c98c"/></svg>'>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main id="shell">
      <section id="topbar" aria-label="Resources">
        <div class="brand">
          <span class="mark"></span>
          <strong>Project Briar Crown</strong>
        </div>
        <div id="resources"></div>
        <div class="hud-cluster">
          <div id="state-pill">Menu</div>
          <button id="settings-btn" class="hud-tool" type="button" aria-haspopup="dialog" aria-controls="settings-panel">
            <span class="settings-glyph" aria-hidden="true"></span>
            <span>Settings</span>
          </button>
        </div>
      </section>

      <section id="game-layout">
        <aside id="panel">
          <button id="start-btn" class="primary">Start Skirmish</button>
          <div class="tool-group compact faction-tools" aria-label="Faction">
            <button data-faction="thorn_court">Thorn Court</button>
            <button data-faction="hollow_legion">Hollow Legion</button>
          </div>
          <div class="tool-group compact">
            <button data-mode="tutorial">Tutorial</button>
            <button data-mode="campaign">Campaign Slice</button>
            <button data-mode="local_pve">Local PvE</button>
          </div>
          <div id="guided-flow" aria-label="Guided flow" hidden></div>
          <div class="tool-group build-tools">
            <button data-build="farmstead">Farmstead</button>
            <button data-build="logging_camp">Logging Camp</button>
            <button data-build="mineworks">Mineworks</button>
            <button data-build="barracks">Barracks</button>
            <button data-build="watchtower">Watchtower</button>
            <button data-build="war_council">War Council</button>
            <button data-build="witchglass_cairn">Witchglass Cairn</button>
            <button data-build="kennels_stables">Kennels/Stables</button>
            <button data-build="relic_vault">Relic Vault</button>
          </div>
          <button id="rotate-btn">Rotate</button>
          <button id="train-btn">Queue Briar Guard</button>
          <button id="train-archer-btn">Queue Needle Archers</button>
          <button id="train-hart-btn">Queue Hart Lancers</button>
          <button id="research-t2-btn">Research Holdfast</button>
          <button id="research-t3-btn">Research Citadel</button>
          <button id="hero-btn">Recruit Thorn Queen</button>
          <button id="ability-btn">Moon Snare</button>
          <div id="command-surface" class="command-grid" aria-label="Command surface">
            <button id="attack-btn">Attack Enemy Seat</button>
            <button id="capture-btn">Capture Witchglass</button>
            <button id="hold-btn">Hold</button>
            <button id="rally-btn">Rally Base</button>
            <button id="retreat-btn">Retreat</button>
            <button id="stance-btn">Stance Guard</button>
            <button id="formation-btn">Formation Line</button>
            <button id="priority-btn">Priority Squads</button>
          </div>
          <div id="squad-cards" aria-label="Squad cards"></div>
          <div id="command-card" aria-label="Command card"></div>
          <div id="production-queue" aria-label="Production queue"></div>
          <div id="objective-cards" aria-label="Objectives"></div>
          <div id="details"></div>
          <div id="alerts" aria-live="polite"></div>
        </aside>
        <canvas id="game" width="1024" height="640" aria-label="Project Briar Crown RTS battlefield"></canvas>
        <div id="outcome-panel" class="outcome-panel" hidden aria-live="polite">
          <span class="outcome-kicker">Match Complete</span>
          <h2 id="outcome-title"></h2>
          <p id="outcome-subtitle"></p>
          <dl id="outcome-stats"></dl>
          <div class="outcome-actions">
            <button id="restart-btn" class="primary">Restart Skirmish</button>
            <button id="return-menu-btn">Return to Menu</button>
          </div>
        </div>
        <div id="settings-panel" class="settings-panel" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
          <div class="settings-head">
            <span>
              <span class="settings-kicker">War Table</span>
              <h2 id="settings-title">Settings</h2>
            </span>
            <button id="settings-close-btn" class="icon-only" type="button" aria-label="Close settings">
              <span class="close-glyph" aria-hidden="true"></span>
            </button>
          </div>
          <div class="settings-actions" aria-label="Match actions">
            <button id="settings-resume-btn" class="primary" type="button">Resume</button>
            <button id="settings-restart-btn" type="button">Restart</button>
            <button id="settings-menu-btn" type="button">Menu</button>
          </div>
          <div class="settings-toggles" aria-label="HUD settings">
            <button id="compact-hud-toggle" type="button" aria-pressed="false">
              <span class="toggle-mark" aria-hidden="true"></span>
              <span>Compact HUD</span>
            </button>
            <button id="mute-audio-toggle" type="button" aria-pressed="false">
              <span class="toggle-mark" aria-hidden="true"></span>
              <span>Mute Cues</span>
            </button>
            <button id="reduced-motion-toggle" type="button" aria-pressed="false">
              <span class="toggle-mark" aria-hidden="true"></span>
              <span>Reduced Motion</span>
            </button>
          </div>
          <div id="settings-status" class="settings-status"></div>
        </div>
        <pre id="text-state" hidden></pre>
      </section>
    </main>
    <script type="module" src="./src/game.mjs"></script>
  </body>
</html>
